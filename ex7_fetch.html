<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            margin: auto;
            width: 80%;
            padding: 10px;
            background-color: rgb(248, 250, 250);
            color: red;
            border: 2px solid blue;
        }
    </style>
</head>
<body>
    <table id = "data">
        <thead>
            <tr>
                <th>Sr. No</th>
                <th>Title</th>
                <th>Category</th>
                <th>Price</th>
                <th>Rating</th>
                <th>Stock</th>
            </tr>
        </thead>
    </table>
    <script>
        const ele=document.getElementById("data");
        const URL="https://dummyjson.com/products/?limit = 100"
         let row=""
        async function loadProducts(URL){
            try{
                const res=await fetch(URL)
                const data=await res.json()
                console.log("Data= ",data.products)

                data.products.map((i,index)=>{
                    row+=`
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src=${i.images[0]}/></td>
                        <td><img src=${i.meta.qrCode}/></td>
                        <td>${i.category}</td>
                        <td>${i.price}</td>
                        <td>${i.rating}</td>
                        <td>${i.stock}</td>
                    </tr>`
                })
                ele.innerHTML+= row;
            }
            catch(err){
                console.log("Error: ",err)
                ele.innerHTML+=(row=="")?"network error ":row
            }
        }
        loadProducts(URL);
    </script>
</body>
</html>
